name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

jobs:
  build:
    name: Build (windows-latest, .NET 8)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore Shelf.sln

      - name: Build (Debug)
        run: dotnet build Shelf.sln -c Debug --no-restore /p:TreatWarningsAsErrors=false

      - name: Build (Release)
        run: dotnet build Shelf.sln -c Release --no-restore /p:TreatWarningsAsErrors=false
