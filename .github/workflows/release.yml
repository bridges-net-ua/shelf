name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Publish & attach artifacts
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version from tag
        id: version
        shell: pwsh
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.tag }}' } else { '${{ github.ref_name }}' }
          if ($tag -notmatch '^v\d+\.\d+\.\d+') {
            Write-Error "Tag '$tag' is not in vX.Y.Z format"
            exit 1
          }
          $version = $tag.TrimStart('v')
          Write-Output "tag=$tag"        | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Output "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Resolved tag=$tag version=$version"

      - name: Restore dependencies
        run: dotnet restore Shelf.sln

      - name: Publish (self-contained folder, win-x64)
        shell: pwsh
        # Plain self-contained publish (NO single-file): widget DLLs must sit
        # next to Shelf.exe as separate files, because WidgetRegistry uses
        # Directory.EnumerateFiles("Shelf.Widgets.*.dll") to discover them.
        # Single-file bundling hides those DLLs inside the .exe and the
        # registry finds zero widget types (the v1.0.0 bug).
        run: |
          dotnet publish Shelf.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:DebugType=embedded `
            -p:Version=${{ steps.version.outputs.version }} `
            -p:FileVersion=${{ steps.version.outputs.version }}.0 `
            -p:AssemblyVersion=${{ steps.version.outputs.version }}.0 `
            -o publish\win-x64

      - name: Remove debug symbols from published folder
        shell: pwsh
        run: |
          Get-ChildItem publish\win-x64 -Recurse -Include *.pdb | Remove-Item -Force

      - name: Create release archive
        shell: pwsh
        run: |
          $zipName = "Shelf-${{ steps.version.outputs.tag }}-win-x64.zip"
          Compress-Archive -Path publish\win-x64\* -DestinationPath $zipName -CompressionLevel Optimal
          Write-Host "Created archive: $zipName"
          Get-Item $zipName | Select-Object Name, Length

      - name: Upload artifact (for inspection)
        uses: actions/upload-artifact@v4
        with:
          name: Shelf-${{ steps.version.outputs.tag }}-win-x64
          path: Shelf-${{ steps.version.outputs.tag }}-win-x64.zip
          retention-days: 30

      - name: Build Store MSIX
        shell: pwsh
        # Builds the MSIX with the same version as the portable zip (tag drives both
        # via make-msix.ps1 -Version). Unsigned - the Microsoft Store re-signs at
        # publish; the file is attached for archival / manual Store upload. Actual
        # Store publishing is a separate manual workflow (store-publish.yml).
        run: |
          ./tools/make-msix.ps1 -Version ${{ steps.version.outputs.version }}
          Copy-Item bin\Store\Shelf.msix "ShelfDesk-${{ steps.version.outputs.tag }}.msix"
          Get-Item "ShelfDesk-${{ steps.version.outputs.tag }}.msix" | Select-Object Name, Length

      - name: Extract release notes from CHANGELOG
        id: notes
        shell: pwsh
        # Pull the section for this version out of CHANGELOG.md and feed it to
        # the Release body. We commit directly to main (no PR flow), so
        # generate_release_notes would just emit an empty "What's Changed" block
        # and a Full Changelog link — the CHANGELOG section is the real source
        # of truth for what users see on the Releases page.
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $lines = Get-Content CHANGELOG.md
          $inSection = $false
          $buffer = New-Object System.Collections.Generic.List[string]
          foreach ($line in $lines) {
            if ($line -match "^## \[$([regex]::Escape($version))\]") { $inSection = $true; continue }
            if ($inSection -and ($line -match "^## \[" -or $line -match "^---\s*$")) { break }
            if ($inSection) { $buffer.Add($line) }
          }
          $notes = ($buffer -join "`n").Trim()
          if ([string]::IsNullOrWhiteSpace($notes)) {
            $notes = "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details."
          }
          # Best-effort previous tag for the comparison link — append only if there is one.
          $prevTag = git describe --tags --abbrev=0 "${{ steps.version.outputs.tag }}^" 2>$null
          if ($LASTEXITCODE -eq 0 -and $prevTag) {
            $notes += "`n`n**Full Changelog**: https://github.com/${{ github.repository }}/compare/$prevTag...${{ steps.version.outputs.tag }}"
          }
          $delim = "EOF_" + [Guid]::NewGuid().ToString('N')
          @"
          notes<<$delim
          $notes
          $delim
          "@.TrimStart() | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Notes preview:"
          Write-Host $notes

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Shelf ${{ steps.version.outputs.tag }}
          body: ${{ steps.notes.outputs.notes }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            Shelf-${{ steps.version.outputs.tag }}-win-x64.zip
            ShelfDesk-${{ steps.version.outputs.tag }}.msix
