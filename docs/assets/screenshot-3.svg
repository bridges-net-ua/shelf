<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2A2A30"/>
      <stop offset="100%" stop-color="#1E1E22"/>
    </linearGradient>
    <linearGradient id="photo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3F3F5F"/>
      <stop offset="50%" stop-color="#5C5C7A"/>
      <stop offset="100%" stop-color="#2A2A3F"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg3)"/>

  <!-- Dock panel on the right -->
  <rect x="640" y="0" width="160" height="500" fill="#34343C" stroke="#3F3F47"/>

  <!-- Pinned section -->
  <rect x="656" y="20" width="128" height="100" rx="8" fill="#2A2A30" stroke="#5C5C62"/>
  <text x="668" y="40" font-family="Segoe UI" font-size="10" font-weight="600" fill="#7A7A82">📌 РАДІО</text>
  <text x="720" y="68" text-anchor="middle" font-family="Segoe UI" font-size="11" fill="#E8E8E8">Хвиля 5</text>
  <circle cx="690" cy="92" r="12" fill="#5C5C62"/>
  <polygon points="687,87 687,97 696,92" fill="#fff"/>
  <rect x="710" y="88" width="60" height="3" rx="1.5" fill="#3F3F47"/>
  <rect x="710" y="88" width="36" height="3" rx="1.5" fill="#7A7A82"/>

  <!-- Photos slideshow with image preview -->
  <rect x="656" y="136" width="128" height="180" rx="8" fill="url(#photo)" stroke="#3F3F47"/>
  <circle cx="700" cy="190" r="22" fill="#FCD34D" opacity="0.7"/>
  <polygon points="685,235 700,205 720,225 740,200 760,225 760,260 685,260" fill="#3F3F5F" opacity="0.8"/>
  <text x="668" y="305" font-family="Segoe UI" font-size="9" fill="rgba(255,255,255,0.7)">Слайд-шоу</text>

  <!-- Holidays widget -->
  <rect x="656" y="332" width="128" height="148" rx="8" fill="#2A2A30" stroke="#3F3F47"/>
  <text x="668" y="350" font-family="Segoe UI" font-size="11" font-weight="600" fill="#B8B8C0">Свята</text>
  <text x="668" y="370" font-family="Segoe UI" font-size="9" fill="#8A8A92">ВЧОРА</text>
  <text x="668" y="383" font-family="Segoe UI" font-size="10" fill="#B8B8C0">25 трав - День філолога</text>
  <text x="668" y="402" font-family="Segoe UI" font-size="9" font-weight="700" fill="#B8B8FF">СЬОГОДНІ</text>
  <text x="668" y="416" font-family="Segoe UI" font-size="11" font-weight="600" fill="#E8E8E8">26 трав</text>
  <text x="668" y="430" font-family="Segoe UI" font-size="10" fill="#E8E8E8">День хіміка</text>
  <text x="668" y="448" font-family="Segoe UI" font-size="9" fill="#8A8A92">ЗАВТРА</text>
  <text x="668" y="461" font-family="Segoe UI" font-size="10" fill="#B8B8C0">27 трав - День працівника</text>
  <text x="668" y="473" font-family="Segoe UI" font-size="10" fill="#B8B8C0">нафтової промисловості</text>

  <!-- Desktop with maximized window beside panel (showing AppBar effect) -->
  <rect x="0" y="0" width="640" height="500" fill="rgba(0,0,0,0.15)"/>
  <rect x="20" y="20" width="600" height="460" rx="6" fill="#252530" stroke="#3F3F47" opacity="0.6"/>
  <rect x="20" y="20" width="600" height="24" rx="6" fill="#1E1E22" opacity="0.7"/>

  <!-- Placeholder label -->
  <text x="320" y="260" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#B8B8C0">Робочий стіл + Поличка</text>
  <text x="320" y="282" text-anchor="middle" font-family="Segoe UI" font-size="11" fill="#7A7A82">(скріншот буде додано)</text>
</svg>
