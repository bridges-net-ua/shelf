<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2A2A30"/>
      <stop offset="100%" stop-color="#1E1E22"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg2)"/>

  <!-- Settings window mockup -->
  <rect x="120" y="60" width="560" height="380" rx="8" fill="#2A2A30" stroke="#3F3F47" stroke-width="1"/>

  <!-- Title bar -->
  <rect x="120" y="60" width="560" height="32" rx="8" fill="#1E1E22"/>
  <rect x="120" y="82" width="560" height="10" fill="#1E1E22"/>
  <text x="140" y="81" font-family="Segoe UI" font-size="12" fill="#B8B8C0">Налаштування - Поличка</text>
  <rect x="640" y="74" width="14" height="2" fill="#B8B8C0"/>
  <text x="664" y="84" font-family="Segoe UI" font-size="14" fill="#B8B8C0">×</text>

  <!-- Tabs -->
  <rect x="140" y="106" width="120" height="28" rx="4" fill="#5C5C62"/>
  <text x="200" y="124" text-anchor="middle" font-family="Segoe UI" font-size="11" fill="#fff">Панель</text>
  <text x="290" y="124" text-anchor="middle" font-family="Segoe UI" font-size="11" fill="#B8B8C0">Віджети</text>
  <text x="380" y="124" text-anchor="middle" font-family="Segoe UI" font-size="11" fill="#B8B8C0">Про програму</text>

  <!-- Section: Position -->
  <text x="140" y="164" font-family="Segoe UI" font-size="11" font-weight="600" fill="#8A8A92">ПОЗИЦІЯ</text>
  <circle cx="148" cy="186" r="6" fill="none" stroke="#7A7A82" stroke-width="1.5"/>
  <text x="162" y="190" font-family="Segoe UI" font-size="12" fill="#E8E8E8">Ліворуч</text>
  <circle cx="148" cy="208" r="6" fill="#5C5C62" stroke="#5C5C62"/>
  <circle cx="148" cy="208" r="2.5" fill="#fff"/>
  <text x="162" y="212" font-family="Segoe UI" font-size="12" fill="#E8E8E8">Праворуч</text>
  <text x="140" y="244" font-family="Segoe UI" font-size="11" fill="#B8B8C0">Ширина: 220 px</text>
  <rect x="140" y="252" width="320" height="3" rx="1.5" fill="#3F3F47"/>
  <rect x="140" y="252" width="170" height="3" rx="1.5" fill="#7A7A82"/>
  <circle cx="310" cy="253.5" r="6" fill="#fff" stroke="#5C5C62"/>

  <!-- Section: Behavior -->
  <text x="140" y="294" font-family="Segoe UI" font-size="11" font-weight="600" fill="#8A8A92">ПОВЕДІНКА</text>
  <rect x="140" y="306" width="14" height="14" rx="2" fill="#5C5C62"/>
  <text x="160" y="318" font-family="Segoe UI" font-size="12" fill="#E8E8E8">Автоматично запускати з Windows</text>
  <rect x="140" y="330" width="14" height="14" rx="2" fill="none" stroke="#5C5C62"/>
  <text x="160" y="342" font-family="Segoe UI" font-size="12" fill="#E8E8E8">Приховувати панель при втраті фокуса</text>
  <rect x="140" y="354" width="14" height="14" rx="2" fill="#5C5C62"/>
  <text x="160" y="366" font-family="Segoe UI" font-size="12" fill="#E8E8E8">Заблокувати порядок віджетів</text>

  <!-- Section: Theme -->
  <text x="140" y="402" font-family="Segoe UI" font-size="11" font-weight="600" fill="#8A8A92">ТЕМА</text>
  <rect x="140" y="414" width="120" height="24" rx="4" fill="#34343C" stroke="#3F3F47"/>
  <text x="150" y="430" font-family="Segoe UI" font-size="11" fill="#E8E8E8">Темна</text>
  <text x="248" y="430" font-family="Segoe UI" font-size="10" fill="#8A8A92">▾</text>

  <!-- Placeholder label -->
  <text x="400" y="476" text-anchor="middle" font-family="Segoe UI" font-size="11" fill="#5C5C62">Налаштування - реальний скріншот замінить макет</text>
</svg>
