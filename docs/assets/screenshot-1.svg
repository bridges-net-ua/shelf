<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2A2A30"/>
      <stop offset="100%" stop-color="#1E1E22"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34343C"/>
      <stop offset="100%" stop-color="#2A2A30"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg1)"/>

  <!-- Mockup of dock panel on the right -->
  <rect x="640" y="0" width="160" height="500" fill="url(#panel)" stroke="#3F3F47" stroke-width="1"/>

  <!-- Widget block: Clock -->
  <rect x="656" y="20" width="128" height="80" rx="8" fill="#2A2A30" stroke="#3F3F47"/>
  <text x="720" y="55" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="300" fill="#E8E8E8">14:32</text>
  <text x="720" y="80" text-anchor="middle" font-family="Segoe UI" font-size="11" fill="#8A8A92">пн, 26 трав</text>

  <!-- Widget block: Notes -->
  <rect x="656" y="116" width="128" height="120" rx="8" fill="#2A2A30" stroke="#3F3F47"/>
  <text x="668" y="138" font-family="Segoe UI" font-size="11" font-weight="600" fill="#B8B8C0">Замітка</text>
  <rect x="668" y="148" width="100" height="6" rx="2" fill="#3F3F47"/>
  <rect x="668" y="160" width="104" height="6" rx="2" fill="#3F3F47"/>
  <rect x="668" y="172" width="80" height="6" rx="2" fill="#3F3F47"/>
  <rect x="668" y="184" width="96" height="6" rx="2" fill="#3F3F47"/>
  <rect x="668" y="196" width="72" height="6" rx="2" fill="#3F3F47"/>

  <!-- Widget block: Weather -->
  <rect x="656" y="252" width="128" height="92" rx="8" fill="#2A2A30" stroke="#3F3F47"/>
  <circle cx="688" cy="280" r="12" fill="none" stroke="#B8B8FF" stroke-width="2"/>
  <text x="722" y="285" font-family="Segoe UI" font-size="18" fill="#E8E8E8">+18°</text>
  <text x="668" y="310" font-family="Segoe UI" font-size="10" fill="#8A8A92">Київ, ясно</text>
  <text x="668" y="324" font-family="Segoe UI" font-size="9" fill="#6E6E76">завтра +21°</text>

  <!-- Widget block: Todo -->
  <rect x="656" y="360" width="128" height="116" rx="8" fill="#2A2A30" stroke="#3F3F47"/>
  <text x="668" y="380" font-family="Segoe UI" font-size="11" font-weight="600" fill="#B8B8C0">Задачі</text>
  <rect x="668" y="392" width="10" height="10" rx="2" fill="none" stroke="#7A7A82"/>
  <rect x="684" y="395" width="76" height="4" rx="1" fill="#B8B8C0"/>
  <rect x="668" y="410" width="10" height="10" rx="2" fill="none" stroke="#7A7A82"/>
  <rect x="684" y="413" width="84" height="4" rx="1" fill="#B8B8C0"/>
  <rect x="668" y="428" width="10" height="10" rx="2" fill="#7A7A82"/>
  <rect x="684" y="431" width="60" height="4" rx="1" fill="#6E6E76"/>
  <rect x="668" y="446" width="10" height="10" rx="2" fill="none" stroke="#7A7A82"/>
  <rect x="684" y="449" width="72" height="4" rx="1" fill="#B8B8C0"/>

  <!-- Placeholder label -->
  <text x="320" y="250" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#5C5C62">Скріншот буде додано</text>
  <text x="320" y="272" text-anchor="middle" font-family="Segoe UI" font-size="11" fill="#3F3F47">Screenshot placeholder</text>
</svg>
