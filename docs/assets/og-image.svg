<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="ogbg" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0%" stop-color="#34343C"/>
      <stop offset="100%" stop-color="#1E1E22"/>
    </radialGradient>
    <linearGradient id="ogpanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3F3F47"/>
      <stop offset="100%" stop-color="#2A2A30"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#ogbg)"/>

